apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: restaurant-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      containers:
        - name: mongodb
          image: shubhibajpai/restaurant-mongodb:3
          ports:
            - containerPort: 27017
          env:
            - name: MONGO_INITDB_DATABASE
              value: restaurant_reviews
