apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: restaurant-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/bajpaishubhi9-web/restaurant-k8s.git
    targetRevision: HEAD
    path: .
    directory:
      recurse: true

  destination:
    server: https://kubernetes.default.svc
    namespace: restaurant-app

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
